name: Build Game for Itch

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Project
        run: npm run build

      # Zip contents are at the root (index.html at top), as itch.io requires
      - name: Upload Zip for Itch.io
        uses: actions/upload-artifact@v4
        with:
          name: itch-game-zip
          path: dist/
