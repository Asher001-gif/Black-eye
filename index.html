<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Eye</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD / UI layers (empty for now, filled in by later steps) -->
  <div id="hud">
    <div id="prompt" class="hidden">Press E</div>
    <div id="arrow" class="hidden"></div>
    <div id="warning" class="hidden"></div>
  </div>
  <div id="dialogue" class="hidden">
    <div id="speaker"></div>
    <div id="line"></div>
    <div id="choices"></div>
  </div>
  <div id="subs" class="hidden"></div>
  <div id="card"></div>
  <div id="location"></div>
  <div id="end"></div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="title">
    <div id="title-inner">
      <h1>BLACK EYE</h1>
      <p class="tag">A story of bodies, borders and the ones left behind</p>
      <button id="enter" type="button">ENTER</button>
      <p class="hint">Press Enter or click &middot; WASD to move &middot; Mouse to look &middot; E to interact</p>
    </div>
  </div>
  <div id="status"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
